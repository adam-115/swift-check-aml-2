spring.application.name=app
server.port=8080
management.endpoints.web.exposure.include=health,info

# Database Configuration (MySQL)
spring.datasource.url=jdbc:mysql://localhost:3306/swift-check-aml?createDatabaseIfNotExist=true&useSSL=false&serverTimezone=UTC&allowPublicKeyRetrieval=true
spring.datasource.username=adam
spring.datasource.password=adam
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# JPA / Hibernate
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=true

# Liquibase Migration
spring.liquibase.change-log=classpath:db/changelog/db.changelog-master.xml
spring.liquibase.enabled=true
